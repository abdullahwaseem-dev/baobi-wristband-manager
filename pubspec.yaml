name: baobi_wristband
description: Baobi Medical Wristband Management System - BB720A
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.0
  printing: ^5.13.0
  http: ^1.2.1
  file_picker: ^8.0.3
  excel: ^4.0.2
  crypto: ^3.0.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Build-tool only (tool/generate_app_icon.dart). Already present transitively
  # via pdf/printing; pinned here so the icon script can import it directly.
  image: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
